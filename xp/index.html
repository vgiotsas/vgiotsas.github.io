<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VGOS · Vasilis Giotsas</title>
<meta name="description" content="Vasilis Giotsas's CV as an early-2000s desktop: papers in My Documents, talks in My Videos, open source in Downloads, and a mail client to get in touch.">
<link rel="canonical" href="https://v.giotsas.com/xp/">
<meta property="og:title" content="VGOS · Vasilis Giotsas">
<meta property="og:description" content="My CV as an early-2000s desktop. Double-click around.">
<meta property="og:image" content="https://v.giotsas.com/xp/img/vasilis-london.jpg">
<meta name="theme-color" content="#2459cf">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233a9b38'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Trebuchet MS,Arial' font-style='italic' font-weight='700' font-size='30' fill='%23fff'%3Evg%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/xp.css?v=9">
</head>
<body>

<!-- Boot screen -->
<div class="screen boot" id="boot" role="button" tabindex="0" aria-label="Starting VGOS. Press to skip.">
  <div class="boot-logo" id="boot-logo"></div>
  <div class="boot-bar"><i></i></div>
  <div class="boot-hint">Click anywhere to skip</div>
</div>

<!-- Login screen -->
<div class="screen login" id="login" hidden>
  <div class="login-wrap">
    <div class="login-left">
      <div class="boot-name">VGOS<small>Vasilis Giotsas Operating System</small></div>
      <p>To begin, click your user name</p>
    </div>
    <div class="login-right">
      <button class="user-tile" id="user-tile" type="button">
        <img src="img/vasilis.jpg" alt="">
        <div><b>Vasilis</b><span>Senior Research Engineer, Cloudflare</span></div>
      </button>
    </div>
  </div>
  <div class="login-foot">
    <button type="button" id="login-off"><span id="login-off-icon"></span>Turn off computer</button>
    <span>After you log on, double-click any icon to explore.</span>
  </div>
</div>

<!-- Shut down screen -->
<div class="screen shutdown" id="shutdown" hidden>
  <div>It's now safe to turn off<br>your computer.</div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
    <button type="button" id="restart">Restart</button>
    <a href="https://v.giotsas.com/">Go to v.giotsas.com</a>
  </div>
</div>

<!-- Desktop -->
<main id="desktop" aria-label="Desktop" hidden>
  <img class="wallpaper" src="img/wallpaper.jpg" alt="" decoding="async">
  <div class="icons" id="icons"></div>
</main>

<div id="windows"></div>

<nav id="taskbar" aria-label="Taskbar" hidden>
  <button type="button" id="start-btn" aria-haspopup="menu" aria-expanded="false"><span id="start-mark"></span>start</button>
  <div id="tasks"></div>
  <div id="tray">
    <button type="button" id="tray-net" title="AS207135: connected"></button>
    <button type="button" id="tray-vol" title="Volume"></button>
    <span id="clock"></span>
  </div>
</nav>

<div id="startmenu" role="menu" hidden></div>
<div id="ctx" hidden></div>

<script src="js/data.js?v=9"></script>
<script src="js/icons.js?v=9"></script>
<script src="js/xp.js?v=9"></script>
</body>
</html>
